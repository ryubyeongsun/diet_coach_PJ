spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
jwt:
  secret: test-only-secret-key-at-least-32-characters-long
logging:
  level:
    com.dietcoach.project: WARN
